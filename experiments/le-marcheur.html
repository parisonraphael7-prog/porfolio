<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Le marcheur</title>
<style>
/* Scène plein écran : un petit voyageur marche sans fin de profil, huit paysages se succèdent, jours, nuits et météo. Un seul look, couleurs fixées par la scène. */
:root { --ciel: #9fb2aa; color-scheme: light; }
html, body { height: 100%; }
body { background: var(--ciel); overflow: hidden; cursor: none; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#voile { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, rgba(20,24,22,0) 55%, rgba(20,24,22,0.26) 100%); }
#grain { position: fixed; inset: -50%; pointer-events: none; opacity: 0.06; mix-blend-mode: overlay; animation: grain 0.9s steps(6) infinite; }
@keyframes grain { 0% { transform: translate(0,0) } 20% { transform: translate(-3%,2%) } 40% { transform: translate(2%,-4%) } 60% { transform: translate(-4%,-1%) } 80% { transform: translate(3%,3%) } 100% { transform: translate(0,0) } }
@media (prefers-reduced-motion: reduce) { #grain { animation: none; } }
#sans-webgl[hidden] { display: none; }
#sans-webgl { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; font: 15px system-ui, sans-serif; color: #2c3a33; }
</style>

<div id="voile" aria-hidden="true"></div>
<div id="grain" aria-hidden="true"></div>
<div id="sans-webgl" hidden>Ce navigateur ne permet pas d’afficher l’animation (WebGL indisponible).</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  if (!window.THREE) { document.getElementById("sans-webgl").hidden = false; return; }
  const reduit = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const VITESSE = reduit ? 0.6 : 1.15;          // unités par seconde
  const LONGUEUR_BIOME = 30 * VITESSE;          // un nouveau paysage toutes les 30 s
  const JOUR = 120;                             // un jour complet en 2 minutes
  const ECHELLE_PERSO = 0.62;                   // le marcheur mesure environ 1 unité, une porte 0,9
  const FOULEE = 0.74;                          // distance parcourue par cycle de deux pas : les pieds ne glissent pas
  const RECENTRAGE = 320;                       // multiple de la longueur des tronçons de terrain
  const TRONCON = 40;

  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lisse = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
  const lerp = (a, b, m) => a + (b - a) * m;
  const lin = hex => new THREE.Color(hex).convertSRGBToLinear();

  /* ---------- bruit déterministe (le terrain doit être identique à chaque passage) ---------- */
  function hash2(i, j) {
    let h = Math.imul(i | 0, 374761393) + Math.imul(j | 0, 668265263);
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }
  function vn2(x, z) {
    const i = Math.floor(x), j = Math.floor(z), fx = x - i, fz = z - j;
    const sx = fx * fx * (3 - 2 * fx), sz = fz * fz * (3 - 2 * fz);
    return lerp(lerp(hash2(i, j), hash2(i + 1, j), sx), lerp(hash2(i, j + 1), hash2(i + 1, j + 1), sx), sz);
  }

  /* ---------- grain de pellicule ---------- */
  (() => {
    const c = document.createElement("canvas"); c.width = c.height = 160;
    const g = c.getContext("2d"), img = g.createImageData(160, 160);
    for (let i = 0; i < img.data.length; i += 4) { const v = Math.random() * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
    g.putImageData(img, 0, 0);
    document.getElementById("grain").style.backgroundImage = `url(${c.toDataURL()})`;
  })();

  /* ---------- rendu ---------- */
  let renderer;
  try { renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" }); }
  catch (e) { document.getElementById("sans-webgl").hidden = false; return; }
  const petitEcran = Math.min(window.innerWidth, window.innerHeight) < 600;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, petitEcran ? 2 : 1.75));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.prepend(renderer.domElement);
  renderer.domElement.setAttribute("aria-hidden", "true");

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 500);
  scene.fog = new THREE.Fog(0xffffff, 18, 90);
  const hemi = new THREE.HemisphereLight(0xffffff, 0x666655, 0.9);
  const soleil = new THREE.DirectionalLight(0xfff1dc, 1.6);
  let tailleOmbre = petitEcran ? 1024 : 2048;
  soleil.castShadow = true;
  soleil.shadow.mapSize.set(tailleOmbre, tailleOmbre);
  Object.assign(soleil.shadow.camera, { left: -16, right: 16, top: 9, bottom: -9, near: 1, far: 120 });
  soleil.shadow.bias = -0.0005;
  soleil.shadow.normalBias = 0.025;
  scene.add(hemi, soleil, soleil.target);

  /* ---------- textures générées ---------- */
  function bruitPeriodique(taille, freq, octaves, fx = 1, fy = 1) {
    const out = new Float32Array(taille * taille);
    let amp = 1, total = 0;
    for (let o = 0; o < octaves; o++) {
      const gx = Math.max(1, Math.round(freq * fx * (1 << o))), gy = Math.max(1, Math.round(freq * fy * (1 << o)));
      const grille = Array.from({ length: gx * gy }, Math.random);
      for (let y = 0; y < taille; y++) for (let x = 0; x < taille; x++) {
        const u = x / taille * gx, v = y / taille * gy;
        const x0 = Math.floor(u), y0 = Math.floor(v), tx = u - x0, ty = v - y0;
        const sx = tx * tx * (3 - 2 * tx), sy = ty * ty * (3 - 2 * ty);
        const a = grille[(y0 % gy) * gx + x0 % gx], b = grille[(y0 % gy) * gx + (x0 + 1) % gx];
        const c = grille[((y0 + 1) % gy) * gx + x0 % gx], d = grille[((y0 + 1) % gy) * gx + (x0 + 1) % gx];
        out[y * taille + x] += amp * lerp(lerp(a, b, sx), lerp(c, d, sx), sy);
      }
      total += amp; amp *= 0.5;
    }
    for (let i = 0; i < out.length; i++) out[i] /= total;
    return out;
  }
  function texture(taille, peindre, rx = 1, ry = 1, srgb = true) {
    const c = document.createElement("canvas"); c.width = c.height = taille;
    const g = c.getContext("2d");
    peindre(g, taille);
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry);
    if (srgb) t.encoding = THREE.sRGBEncoding;
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return t;
  }
  function depuisBruit(g, taille, valeurs, bas, haut) {
    const img = g.createImageData(taille, taille);
    for (let i = 0; i < valeurs.length; i++) {
      const v = Math.round(255 * lerp(bas, haut, valeurs[i]));
      img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = v; img.data[i * 4 + 3] = 255;
    }
    g.putImageData(img, 0, 0);
  }
  const TEX = {
    objet: texture(128, (g, s) => depuisBruit(g, s, bruitPeriodique(s, 4, 4), 0.8, 1)),
    sol: texture(256, (g, s) => {
      depuisBruit(g, s, bruitPeriodique(s, 5, 5), 0.72, 1);
      for (let i = 0; i < 1400; i++) {
        g.fillStyle = Math.random() < 0.5 ? "rgba(0,0,0,0.09)" : "rgba(255,255,255,0.09)";
        g.fillRect(Math.random() * s, Math.random() * s, 1 + Math.random() * 2, 1 + Math.random() * 3);
      }
    }),
    chemin: texture(256, (g, s) => {
      depuisBruit(g, s, bruitPeriodique(s, 6, 4), 0.8, 1);
      for (let i = 0; i < 220; i++) {
        const x = Math.random() * s, y = Math.random() * s, r = 1 + Math.random() * 3;
        g.fillStyle = `rgba(${Math.random() < 0.5 ? "60,50,40" : "250,245,235"},0.18)`;
        g.beginPath(); g.ellipse(x, y, r, r * 0.7, Math.random() * 3, 0, Math.PI * 2); g.fill();
      }
    }),
    // bords du chemin fondus et irréguliers (canal alpha, répété le long du chemin)
    bordChemin: texture(256, (g, s) => {
      const bruit = bruitPeriodique(s, 6, 4, 1, 0.25);
      const img = g.createImageData(s, s);
      for (let y = 0; y < s; y++) for (let x = 0; x < s; x++) {
        const v = y / (s - 1), n = (bruit[y * s + x] - 0.5) * 0.28;
        const a = lisse(0.02, 0.3, v + n) * (1 - lisse(0.7, 0.98, v - n));
        const i = (y * s + x) * 4; img.data[i] = img.data[i + 1] = img.data[i + 2] = Math.round(255 * a); img.data[i + 3] = 255;
      }
      g.putImageData(img, 0, 0);
    }, 1, 1, false),
    ecorce: texture(128, (g, s) => depuisBruit(g, s, bruitPeriodique(s, 2, 4, 6, 0.5), 0.6, 1)),
    bouleau: texture(128, (g, s) => {
      g.fillStyle = "#fff"; g.fillRect(0, 0, s, s);
      for (let i = 0; i < 40; i++) { g.fillStyle = "rgba(30,30,30,0.75)"; g.fillRect(Math.random() * s, Math.random() * s, 6 + Math.random() * 18, 2 + Math.random() * 3); }
    }),
    toit: texture(128, (g, s) => {
      depuisBruit(g, s, bruitPeriodique(s, 4, 3), 0.8, 1);
      g.strokeStyle = "rgba(0,0,0,0.26)"; g.lineWidth = 2;
      for (let y = 0; y < s; y += 16) { g.beginPath(); g.moveTo(0, y); g.lineTo(s, y); g.stroke();
        for (let x = (y / 16) % 2 ? 0 : 8; x < s; x += 16) { g.beginPath(); g.moveTo(x, y); g.lineTo(x, y + 16); g.stroke(); } }
    }, 2, 2),
    bois: texture(128, (g, s) => {
      depuisBruit(g, s, bruitPeriodique(s, 1, 4, 0.5, 8), 0.72, 1);
      g.strokeStyle = "rgba(0,0,0,0.26)"; g.lineWidth = 2;
      for (let y = 0; y < s; y += 16) { g.beginPath(); g.moveTo(0, y); g.lineTo(s, y); g.stroke(); }
    }, 2, 2),
    eau: texture(256, (g, s) => depuisBruit(g, s, bruitPeriodique(s, 2, 5, 3, 12), 0.6, 1), 1, 1, false)
  };

  /* ---------- géométries lisses ---------- */
  function deformer(geo, force, freq, graine) {
    const p = geo.attributes.position, v = new THREE.Vector3();
    for (let i = 0; i < p.count; i++) {
      v.fromBufferAttribute(p, i);
      const n = Math.sin(v.x * freq + graine) * Math.sin(v.y * freq * 1.3 + graine * 2.1) * Math.sin(v.z * freq * 0.8 + graine * 3.7)
              + 0.5 * Math.sin(v.x * freq * 2.3 + graine * 5) * Math.sin(v.z * freq * 2.1 - graine);
      v.multiplyScalar(1 + force * n);
      p.setXYZ(i, v.x, v.y, v.z);
    }
    geo.computeVertexNormals();
    return geo;
  }
  function gelule(r, l, segs = 20) { // capsule lisse le long de y, profil du bas vers le haut (faces vers l'extérieur)
    const pts = [];
    for (let i = 0; i <= 8; i++) { const a = -Math.PI / 2 + (i / 8) * Math.PI / 2; pts.push(new THREE.Vector2(Math.cos(a) * r + 1e-4, -l / 2 + Math.sin(a) * r)); }
    for (let i = 0; i <= 8; i++) { const a = (i / 8) * Math.PI / 2; pts.push(new THREE.Vector2(Math.cos(a) * r + 1e-4, l / 2 + Math.sin(a) * r)); }
    return new THREE.LatheGeometry(pts, segs);
  }
  const toitDeuxPans = (() => {
    const s = new THREE.Shape(); s.moveTo(-0.55, 0); s.lineTo(0.55, 0); s.lineTo(0, 0.5); s.closePath();
    const g = new THREE.ExtrudeGeometry(s, { depth: 1, bevelEnabled: true, bevelThickness: 0.03, bevelSize: 0.03, bevelSegments: 2 });
    g.translate(0, 0, -0.5); return g;
  })();
  const G = {
    cone: new THREE.ConeGeometry(1, 1, 24, 2),
    cyl: new THREE.CylinderGeometry(1, 1, 1, 20),
    tronc: new THREE.CylinderGeometry(0.7, 1, 1, 14),
    boule: new THREE.SphereGeometry(1, 32, 20),
    feuillages: [0, 1, 2, 3].map(i => deformer(new THREE.SphereGeometry(1, 32, 20), 0.11, 2.4, i * 7.3 + 1)),
    rocs: [0, 1, 2, 3].map(i => deformer(new THREE.SphereGeometry(1, 18, 12), 0.26, 1.7, i * 5.1 + 2)),
    monts: [0, 1, 2].map(i => deformer(new THREE.ConeGeometry(1, 1, 32, 10), 0.06, 3.1, i * 4.2 + 3)),
    collines: [0, 1].map(i => deformer(new THREE.SphereGeometry(1, 32, 16), 0.05, 2, i * 3 + 9)),
    boite: new THREE.BoxGeometry(1, 1, 1),
    toit: toitDeuxPans,
    brin: new THREE.ConeGeometry(1, 1, 6)
  };

  /* ---------- matériaux ---------- */
  const lumieres = new Set(), halos = new Set();
  function mat(couleur, varier = 0.04, carte = "objet", rugosite = 0.92) {
    const c = lin(couleur); c.offsetHSL(0, 0, rnd(-varier, varier) * 0.6);
    const t = TEX[carte] || TEX.objet;
    return new THREE.MeshStandardMaterial({ color: c, roughness: rugosite, metalness: 0, map: t, bumpMap: t, bumpScale: 0.012 });
  }
  function matLumiere(couleur, seuil = rnd(0.1, 1)) {
    const m = new THREE.MeshStandardMaterial({ color: lin(couleur), emissive: lin("#ffbf66"), emissiveIntensity: 0, roughness: 0.6 });
    m.userData.seuil = seuil; lumieres.add(m); return m;
  }
  function maillage(geo, couleur, sx, sy, sz, x, y, z, varier, carte) {
    const m = new THREE.Mesh(geo, typeof couleur === "string" ? mat(couleur, varier, carte) : couleur);
    m.scale.set(sx, sy, sz); m.position.set(x, y, z);
    m.castShadow = true;
    return m;
  }
  const feuillage = () => pick(G.feuillages), roc = () => pick(G.rocs);

  function rondDoux() {
    const c = document.createElement("canvas"); c.width = c.height = 64;
    const g = c.getContext("2d"), r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    r.addColorStop(0, "rgba(255,255,255,1)"); r.addColorStop(0.4, "rgba(255,255,255,0.55)"); r.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = r; g.fillRect(0, 0, 64, 64);
    return new THREE.CanvasTexture(c);
  }
  const TEX_DOUX = rondDoux();
  function halo(taille, couleur, seuil = 0.1) {
    const m = new THREE.SpriteMaterial({ map: TEX_DOUX, color: lin(couleur), transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending, fog: false });
    m.userData.seuil = seuil; halos.add(m);
    const s = new THREE.Sprite(m); s.scale.set(taille, taille, 1); return s;
  }

  /* ---------- les huit paysages ---------- */
  const biomes = [
    { nom: "forêt", ciel: "#8fb0b6", horizon: "#d4ddd2", sol: "#55693c", chemin: "#8b7f5c", relief: 1,
      feuillage: ["#2f4a33", "#3a5a3a", "#284234"], tronc: "#5a4634", roche: "#7d8279", colline: "#5d7356", montagne: "#7c8f96", herbe: "#4b6235", sommet: "#e8eeee",
      proche: ["sapin", "sapin", "sapin", "rocher", "buisson"], moyen: ["sapin", "sapin", "sapin", "buisson"], loin: ["montagne", "vide"], devant: ["herbe", "herbe", "fleurs"],
      meteo: { pluie: 0.55, neige: 0, brume: 0.45 } },
    { nom: "alpage", ciel: "#8ab4d2", horizon: "#e2ebee", sol: "#5f7843", chemin: "#a39470", relief: 1.5,
      feuillage: ["#2f4a33", "#3d5c3b"], tronc: "#5a4634", roche: "#8d9190", colline: "#6b8752", montagne: "#a9b6bd", herbe: "#577540", sommet: "#f4f6f6",
      murs: ["#8a5a3a", "#7a4e33"], toit: ["#4a3b33", "#5a3f30"],
      proche: ["chalet", "cloture", "sapin", "rocher", "cloture"], moyen: ["sapin", "chalet", "sapin", "rocher"], loin: ["montagne", "montagne", "montagne"], devant: ["fleurs", "herbe"],
      meteo: { pluie: 0.2, neige: 0, brume: 0.2 } },
    { nom: "toundra", ciel: "#94a6b4", horizon: "#dfe5e8", sol: "#b3bab8", chemin: "#979b94", relief: 1.1,
      feuillage: ["#dfe5e4", "#cdd6d4", "#4d6352"], tronc: "#4a3f36", roche: "#737a79", colline: "#b4bcbb", montagne: "#c6cdce", herbe: "#8f9893", sommet: "#f4f6f6",
      proche: ["neige", "neige", "rocher", "rocher"], moyen: ["neige", "rocher", "neige"], loin: ["montagne", "montagne"], devant: ["herbe"],
      meteo: { pluie: 0, neige: 0.9, brume: 0.35 } },
    { nom: "automne", ciel: "#b39c86", horizon: "#ecd5b4", sol: "#7d5d36", chemin: "#a88b62", relief: 0.9,
      feuillage: ["#c47a35", "#a9532e", "#d39a45"], tronc: "#e9e3d6", roche: "#8a7c6c", colline: "#946a3e", montagne: "#9a8a84", herbe: "#7a5a32",
      proche: ["bouleau", "bouleau", "bouleau", "buisson"], moyen: ["bouleau", "buisson", "bouleau", "rond"], loin: ["montagne", "vide"], devant: ["herbe"],
      meteo: { pluie: 0.6, neige: 0, brume: 0.55 } },
    { nom: "village", ciel: "#a3b8bf", horizon: "#e4e6dc", sol: "#6e7a4c", chemin: "#8a8478", relief: 0.6,
      feuillage: ["#5f7a3c", "#6b8040"], tronc: "#5a4532", roche: "#8a8a80", colline: "#7d8a5a", montagne: "#9fa8a6", herbe: "#5a6a38",
      murs: ["#ede2cc", "#dcc6a4", "#cbd2c6", "#e6cdbc"], toit: ["#9a4a36", "#7a3f32", "#5a5a5e"],
      proche: ["maison", "maison", "cloture", "lampadaire", "rond", "lampadaire"], moyen: ["maison", "rond", "maison", "rond"], loin: ["vide", "montagne"], devant: ["herbe", "fleurs"],
      meteo: { pluie: 0.35, neige: 0, brume: 0.3 } },
    { nom: "prairie", ciel: "#a6bcc4", horizon: "#efe8c8", sol: "#8a8a4c", chemin: "#b5a376", relief: 0.7,
      feuillage: ["#6b7d3a", "#7f8a42", "#5c7038"], tronc: "#5a4532", roche: "#9a9480", colline: "#a39c5e", montagne: "#a7ae9b", herbe: "#7f8040",
      proche: ["rond", "rond", "buisson", "buisson"], moyen: ["rond", "buisson", "rond"], loin: ["vide", "vide", "montagne"], devant: ["fleurs", "herbe", "herbe"],
      meteo: { pluie: 0.15, neige: 0, brume: 0.1 } },
    { nom: "désert", ciel: "#c8b49a", horizon: "#f2dfbd", sol: "#c49f6c", chemin: "#b48a58", relief: 0.5,
      feuillage: ["#6f8a4a", "#5f7a40"], tronc: "#5a4532", roche: "#b0704a", colline: "#d9b680", montagne: "#c2825a", herbe: "#a88a50",
      proche: ["cactus", "rocher", "dune", "cactus"], moyen: ["dune", "cactus", "rocher", "dune"], loin: ["mesa", "vide", "mesa"], devant: ["herbe"],
      meteo: { pluie: 0, neige: 0, brume: 0.15 } },
    { nom: "bord de mer", ciel: "#8fbccb", horizon: "#e2eeee", sol: "#cdbd92", chemin: "#b8a77e", relief: 0.4,
      feuillage: ["#3f5a3a", "#4a663f"], tronc: "#6a4e3a", roche: "#9a9a92", colline: "#b9b48a", montagne: "#c9c8bc", herbe: "#9a9a62",
      proche: ["pin", "rocher", "buisson", "herbe"], moyen: ["pin", "rocher", "pin", "buisson", "pin", "rocher", "buisson", "phare"], loin: ["falaise", "falaise", "montagne"], devant: ["herbe"],
      meteo: { pluie: 0.25, neige: 0, brume: 0.4 } }
  ].map(b => ({ ...b, c: { ciel: lin(b.ciel), horizon: lin(b.horizon), sol: lin(b.sol), chemin: lin(b.chemin), colline: lin(b.colline) } }));
  const IDX = Object.fromEntries(biomes.map((b, i) => [b.nom, i]));

  let x = 0;
  let parcouru = rnd(0, LONGUEUR_BIOME * biomes.length);
  const distanceA = X => parcouru + (X - x);       // position d'un point du monde le long du voyage

  function biomeEnCours(d) {
    const f = ((d / LONGUEUR_BIOME) % biomes.length + biomes.length) % biomes.length;
    const i = Math.floor(f);
    return { a: biomes[i], b: biomes[(i + 1) % biomes.length], m: lisse(0.7, 1, f - i) };
  }
  const poids = (nom, a, b, m) => (a.nom === nom ? 1 - m : 0) + (b.nom === nom ? m : 0);

  /* ---------- terrain : relief, mer et lacs, tout en une fonction continue ---------- */

  const faune = [];
  const yeux = new Set();
  const NOIR = "#1e1b19";
  function matYeux() {
    const m = new THREE.MeshStandardMaterial({ color: lin("#1c1a18"), emissive: lin("#dbe86c"), emissiveIntensity: 0, roughness: 0.3 });
    yeux.add(m); return m;
  }
  function pivot(parent, x, y, z) { const p = new THREE.Group(); p.position.set(x, y, z); parent.add(p); return p; }
  function os(parent, couleur, r, l, x, y, z, rz = 0, rx = 0) { // segment arrondi : longueur droite l + deux bouts de rayon r
    const m = maillage(gelule(r, Math.max(0.001, l), 12), couleur, 1, 1, 1, x, y, z, 0.02);
    m.rotation.set(rx, 0, rz); parent.add(m); return m;
  }
  function boule(parent, couleur, sx, sy, sz, x, y, z) { const m = maillage(G.boule, couleur, sx, sy, sz, x, y, z, 0.02); parent.add(m); return m; }

  // quadrupède générique tourné vers +x
  function quadrupede(o) {
    const g = new THREE.Group(), corps = pivot(g, 0, o.H + o.R * 0.55, 0);
    const tronc = maillage(gelule(o.R, o.L, 18), o.c, 1, 1, o.Rz || 1, 0, 0, 0, 0.02); tronc.rotation.z = Math.PI / 2; corps.add(tronc);
    const jambes = [[1, 1], [1, -1], [-1, 1], [-1, -1]].map(([sx, sz]) => {
      const p = pivot(corps, sx * o.L * 0.42, -o.R * 0.35, sz * o.R * 0.5);
      const l = o.H + o.R * 0.2;
      os(p, o.cp || o.c, o.rp, l - o.rp * 2, 0, -l / 2, 0);
      return p;
    });
    const cou = pivot(corps, o.L * 0.5 + o.R * 0.45, o.R * 0.3, 0); cou.rotation.z = -(o.angle || 0); // angle compté depuis la verticale, vers l'avant
    if (o.cou > 0.01) os(cou, o.c, o.R * 0.45, o.cou, 0, o.cou / 2, 0);
    const tete = pivot(cou, 0, o.cou, 0); tete.rotation.z = o.angle || 0;
    const T = o.T;
    boule(tete, o.ct || o.c, T, T * 0.88, T * 0.82, 0, 0, 0);
    os(tete, o.cm || o.ct || o.c, T * 0.42, T * 0.55, T * 0.62, -T * 0.25, 0, Math.PI / 2);
    boule(tete, NOIR, T * 0.13, T * 0.11, T * 0.13, T * 1.32, -T * 0.2, 0);
    const mo = matYeux();
    for (const sz of [1, -1]) { const oe = new THREE.Mesh(G.boule, mo); oe.scale.setScalar(T * 0.13); oe.position.set(T * 0.55, T * 0.25, sz * T * 0.6); tete.add(oe); }
    for (const sz of [1, -1]) {
      if (o.oreilles === "pointues") { const or = maillage(G.cone, o.ct || o.c, T * 0.28, T * 0.6, T * 0.16, -T * 0.15, T * 0.9, sz * T * 0.45, 0.02); or.rotation.x = sz * 0.25; tete.add(or); }
      if (o.oreilles === "longues") os(tete, o.ct || o.c, T * 0.18, T * 1.2, -T * 0.2, T * 1.25, sz * T * 0.3, 0.3, sz * 0.15);
      if (o.oreilles === "rondes") boule(tete, o.ct || o.c, T * 0.25, T * 0.25, T * 0.12, -T * 0.2, T * 0.75, sz * T * 0.62);
    }
    const queue = pivot(corps, -o.L * 0.5 - o.R * 0.55, o.R * 0.25, 0); queue.rotation.z = o.angleQueue ?? 2.4;
    if (o.lq > 0) os(queue, o.cq || o.c, o.rq, o.lq, 0, o.lq / 2 + o.rq, 0);
    else boule(queue, o.cq || o.c, o.rq, o.rq, o.rq, 0, o.rq * 0.6, 0);
    return { g, corps, jambes, cou, tete, queue, hCorps: corps.position.y };
  }
  const trot = (q, ph, amp) => { q.jambes[0].rotation.z = q.jambes[3].rotation.z = Math.sin(ph) * amp; q.jambes[1].rotation.z = q.jambes[2].rotation.z = -Math.sin(ph) * amp; };
  const marche = (q, ph, amp) => q.jambes.forEach((j, i) => j.rotation.z = Math.sin(ph + [0, Math.PI, Math.PI / 2, Math.PI * 1.5][i]) * amp);
  const repos = q => q.jambes.forEach(j => j.rotation.z *= 0.85);
  const vers = (v, cible, k) => v + (cible - v) * Math.min(1, k);

  const ANIMAUX = {
    lapin(b, blanc) {

      const q = quadrupede({ L: 0.1, H: 0.045, R: 0.068, c, T: 0.056, cou: 0.02, angle: 0.9, rp: 0.018, rq: 0.026, lq: 0, cq: "#f2eee6", oreilles: "longues" });
      const s = { mode: "repos", t: rnd(0.5, 2), dir: Math.random() < 0.5 ? 1 : -1, p: 0, n: 0 };
      q.g.rotation.y = s.dir > 0 ? 0 : Math.PI;
      return { g: q.g, maj(dt, t) {

        q.cou.rotation.z = vers(q.cou.rotation.z, -s.cible, dt * 1.5);
        q.tete.rotation.z = -q.cou.rotation.z * 0.75 + (s.cible > 1 ? Math.sin(t * 7) * 0.05 : 0);

    },
    vache(b) {
      const q = quadrupede({ L: 0.8, H: 0.42, R: 0.3, Rz: 0.88, c: "#ebe6dc", cm: "#e8b9a8", T: 0.16, cou: 0.26, angle: 1.15, rp: 0.07, rq: 0.02, lq: 0.4, angleQueue: 2.9, oreilles: "rondes" });
      for (let k = 0; k < 6; k++) { const cote = k % 3 ? 1 : -1; boule(q.corps, "#5a4636", rnd(0.08, 0.13), rnd(0.07, 0.1), 0.05, rnd(-0.45, 0.4), rnd(-0.08, 0.14), cote * 0.235); }
      for (const sz of [1, -1]) { const co = maillage(G.cone, "#efe6cf", 0.025, 0.09, 0.025, -0.03, 0.17, sz * 0.12, 0); co.rotation.x = -sz * 0.6; q.tete.add(co); }

    },
    marmotte(b) {
      const q = quadrupede({ L: 0.15, H: 0.04, R: 0.085, c: "#8b6a45", cm: "#c9b08a", T: 0.065, cou: 0.02, angle: 0.6, rp: 0.02, rq: 0.03, lq: 0.05, angleQueue: 2.0, oreilles: "rondes" });
      const s = { debout: false, t: rnd(1, 3) };

    renard(b, polaire) {

      const q = quadrupede({ L: 0.3, H: 0.17, R: 0.075, c, cm: polaire ? "#f6f6f4" : "#f0e6d8", cp: polaire ? c : "#3a2a22", T: 0.068, cou: 0.08, angle: 1.0, rp: 0.016, rq: 0.045, lq: 0.18, angleQueue: 2.15, oreilles: "pointues" });
      boule(q.queue, polaire ? "#ffffff" : "#f4efe6", 0.045, 0.05, 0.045, 0, 0.27, 0);

      q.g.rotation.y = Math.PI; // il vient vers le marcheur et le croise sans s'arrêter
      return { g: q.g, maj(dt, t) {
        s.t -= dt;
        if (s.pause > 0) { s.pause -= dt; repos(q); q.cou.rotation.z = vers(q.cou.rotation.z, -1.9, dt * 4); q.tete.rotation.z = vers(q.tete.rotation.z, 1.3, dt * 4); }
        else { s.ph += dt * 11; q.g.position.x -= 0.55 * dt; trot(q, s.ph, 0.55); q.corps.position.y = q.hCorps + Math.abs(Math.sin(s.ph)) * 0.012; q.cou.rotation.z = vers(q.cou.rotation.z, -1.0, dt * 4); q.tete.rotation.z = vers(q.tete.rotation.z, 1.0, dt * 4); }

    },
    renardPolaire(b) { return ANIMAUX.renard(b, true); },
    ecureuil(b) {
      const q = quadrupede({ L: 0.08, H: 0.03, R: 0.042, c: "#a8552a", cm: "#e9d6b8", T: 0.04, cou: 0.015, angle: 0.9, rp: 0.011, rq: 0.035, lq: 0.1, angleQueue: 0.45, oreilles: "pointues" });
      const bout = pivot(q.queue, 0, 0.17, 0); bout.rotation.z = -1.2; os(bout, "#a8552a", 0.032, 0.05, 0, 0.04, 0);
      const s = { course: 0, t: rnd(0.6, 2), dir: Math.random() < 0.5 ? 1 : -1, ph: 0 };

    },
    chat(b) {
      const c = pick(["#7d7a76", "#c98b4a", "#2e2b2a", "#e8e2d6"]);
      const q = quadrupede({ L: 0.2, H: 0.1, R: 0.058, c, T: 0.064, cou: 0.05, angle: 0.8, rp: 0.016, rq: 0.013, lq: 0.17, angleQueue: 0.55, oreilles: "pointues" });

      q.g.rotation.y = Math.random() < 0.5 ? 0 : Math.PI;
      const sens = q.g.rotation.y ? -1 : 1;

        s.t -= dt; if (s.t < 0) { s.assis = !s.assis; s.t = s.assis ? rnd(3, 6) : rnd(2, 4); }

    },
    poules(b) {
      const g = new THREE.Group(), membres = [];

        const p = pivot(g, k * rnd(0.3, 0.45), 0, rnd(-0.25, 0.25)); p.rotation.y = Math.random() < 0.5 ? 0 : Math.PI;

    },
    lezard(b) {
      const g = new THREE.Group(), corps = pivot(g, 0, 0.025, 0);

    },
    papillons(b) {
      // espèces selon le paysage ; chacun vole puis se pose un moment, ailes qui s'ouvrent lentement
      const ESPECES = { "alpage": [["#8fb6e8", "#4a6a9a"], ["#f0f0ea", "#9a9a92"], ["#cfe0f5", "#6a8ab8"]], "forêt": [["#c0622a", "#2a2422"], ["#e8b04a", "#7a5a3a"]],
        "automne": [["#d0702a", "#3a2a22"], ["#e0a050", "#8a5a2a"]], "village": [["#f0f0ea", "#2a2826"], ["#f2d46a", "#8a7a3a"]], "prairie": [["#f2d46a", "#8a7a3a"], ["#f0f0ea", "#2a2826"], ["#e8a24a", "#5a3a22"]] };

      const n = 2 + Math.floor(Math.random() * 2);

        const p = pivot(g, 0, 0, 0);
        const [c, tache] = pick(palette);
        const m = new THREE.MeshStandardMaterial({ color: lin(c), roughness: 0.8, side: THREE.DoubleSide });
        const mt = new THREE.MeshStandardMaterial({ color: lin(tache), roughness: 0.8, side: THREE.DoubleSide });
        os(p, NOIR, 0.006, 0.025, 0, 0, 0, Math.PI / 2);
        const ailes = [1, -1].map(sz => {
          const a = pivot(p, 0, 0, 0);

          const t2 = new THREE.Mesh(new THREE.CircleGeometry(0.011, 8), mt); t2.rotation.x = -Math.PI / 2; t2.position.set(0.008, 0.001 * sz, sz * 0.045); a.add(t2);

  const FAUNE_JOUR = { "forêt": ["lapin", "cerf", "lapin", "ecureuil", "papillons"], "alpage": ["marmotte", "vache", "vache", "marmotte", "papillons"], "toundra": ["renardPolaire", "lievreBlanc"],
    "automne": ["ecureuil", "ecureuil", "cerf", "renard", "papillons"], "village": ["chat", "poules", "poules", "chat", "papillons"], "prairie": ["lapin", "papillons", "papillons", "renard"],
    "désert": ["lezard", "lezard"], "bord de mer": ["crabe", "mouettes", "crabe"] };
  const FAUNE_NUIT = { "forêt": ["hibou", "chauvesouris", "renard"], "alpage": ["hibou", "chauvesouris"], "toundra": ["renardPolaire", "hibou"],

  const matMouette = new THREE.MeshStandardMaterial({ color: lin("#f2f2ee"), roughness: 0.9, side: THREE.DoubleSide });
  let prochaineFaune = rnd(3, 6);

      const dir = Math.random() < 0.5 ? 1 : -1, hw = demiLargeur(-10) + 4, y0 = rnd(3.5, 5.5);
      for (let k = 0; k < 2 + Math.floor(Math.random() * 3); k++) nouvelOiseau(camera.position.x - dir * (hw + k * rnd(0.8, 1.6)), y0 + rnd(-0.4, 0.4), rnd(-7, -12), dir * rnd(1.6, 2.2), matMouette, 1.6, true);

  function animerFaune(dt, t, nuit) {

      a.g.position.y = hauteurEn(a.g.position.x, a.g.position.z) + (a.haut || 0);
      if (a.g.position.x < camera.position.x - demiLargeur(a.g.position.z) - 3) retirerFaune(i);
    }
  }

  /* ---------- détails : passages, traces de pas, arc-en-ciel, brume du matin, étoiles filantes ---------- */

  // passages entre deux paysages : pont sur un ruisseau, panneau en bois, borne
  const passagesFaits = new Set();
  function construirePassage(type) {
    const g = new THREE.Group(), bois = "#7a5a40";
    if (type === "pont") {
      for (let i = -6; i <= 6; i++) {
        const px = i * 0.24, d = Math.abs(px);
        const planche = maillage(G.boite, bois, 0.22, 0.05, 1.3, px, hauteurPont(d) - 0.025, 0.55, 0.06, "bois");
        planche.rotation.z = -Math.sign(px) * Math.atan(0.32 * d / 2.25); g.add(planche);
      }
      for (const z of [-0.12, 1.22]) {
        for (const px of [-1.44, -0.72, 0, 0.72, 1.44]) g.add(maillage(gelule(0.03, 0.42, 10), bois, 1, 1, 1, px, hauteurPont(Math.abs(px)) + 0.22, z, 0.05, "bois"));
        for (const [a, b] of [[-1.44, -0.72], [-0.72, 0], [0, 0.72], [0.72, 1.44]]) {
          const ya = hauteurPont(Math.abs(a)) + 0.42, yb = hauteurPont(Math.abs(b)) + 0.42, l = Math.hypot(b - a, yb - ya);
          const r = maillage(G.boite, bois, l + 0.04, 0.04, 0.04, (a + b) / 2, (ya + yb) / 2, z, 0.04, "bois"); r.rotation.z = Math.atan2(yb - ya, b - a); g.add(r);
        }
      }
    } else if (type === "panneau") {

      for (const [y, sens, ry] of [[0.95, 1, 0.15], [0.74, -1, -0.2]]) {
        const fl = new THREE.Group(); fl.position.set(0, y, 0.03); fl.rotation.y = ry;
        fl.add(maillage(G.boite, "#9a7650", 0.42, 0.12, 0.025, sens * 0.2, 0, 0, 0.05, "bois"));
        const pointe = maillage(G.toit, "#9a7650", 0.12, 0.24, 0.025, sens * 0.44, -0.06, 0, 0.05, "bois"); pointe.rotation.z = -sens * Math.PI / 2; fl.add(pointe);
        g.add(fl);
      }
      g.rotation.z = rnd(-0.04, 0.04);
    } else {
      g.add(maillage(gelule(0.12, 0.2, 18), "#e6e2d8", 1, 1, 0.55, 0, 0.18, 0, 0.02));
      g.add(maillage(new THREE.SphereGeometry(0.122, 24, 10, 0, Math.PI * 2, 0, Math.PI * 0.5), "#b8443a", 1, 1, 0.56, 0, 0.3, 0, 0.02));

  }
  function majPassages() {
    const k0 = Math.floor(parcouru / LONGUEUR_BIOME) - 1;

      const g = construirePassage(type);
      g.position.set(X, type === "pont" ? 0 : hauteurEn(X, -0.45), type === "pont" ? 0 : -0.45);
      g.userData.marge = hw;
      g.traverse(n => { if (n.isMesh) { n.castShadow = true; n.receiveShadow = true; } });
      monde.add(g); passagesFaits.add(k);

  }

  // traces de pas dans la neige et le sable
  const geoPas = new THREE.CircleGeometry(1, 14);

    const m = new THREE.Mesh(geoPas, new THREE.MeshStandardMaterial({ color: 0x888888, transparent: true, opacity: 0, depthWrite: false, roughness: 1, polygonOffset: true, polygonOffsetFactor: -3 }));
    m.rotation.x = -Math.PI / 2; m.scale.set(0.05, 0.028, 1); m.visible = false; m.renderOrder = 2; scene.add(m);
    return { m, vie: 0, force: 0 };
  });

  function majTraces(ph, dt) {
    const idx = Math.floor(ph / Math.PI);

      const C = colonne(distanceA(x));
      const neige = poids("toundra", C.a, C.b, C.m), sable = poids("désert", C.a, C.b, C.m) + poids("bord de mer", C.a, C.b, C.m);
      const w = Math.max(neige, sable);

  }

  // arc-en-ciel quand une averse s'arrête en plein jour
  const matArc = new THREE.ShaderMaterial({

    vertexShader: `varying vec2 vP; void main(){ vP = position.xy; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,

  // brume du matin : des nappes basses qui se dissipent

  // étoiles filantes, clin d'œil à l'autre prototype

      vieFilante = 0; prochaineFilante = rnd(5, 12);

  // qualité adaptative : on mesure, puis on allège si l'appareil peine
  let niveauQualite = 0, qualiteFigee = false, mesureT = -2, mesureN = 0, mesureS = 0;
  function majQualite(brut) {
    if (qualiteFigee || niveauQualite >= 2 || brut >= 0.1) return;
    mesureT += brut;
    if (mesureT < 0) return;
    mesureN++; mesureS += brut;
    if (mesureT < 3) return;
    const moyenne = mesureS / mesureN;
    if (moyenne > 1 / 45) {
      niveauQualite++;
      const ratio = niveauQualite === 1 ? Math.max(1, renderer.getPixelRatio() * 0.75) : 1;
      renderer.setPixelRatio(ratio); redim();
      tailleOmbre = niveauQualite === 1 ? 1024 : 512;
      soleil.shadow.mapSize.set(tailleOmbre, tailleOmbre);
      if (soleil.shadow.map) { soleil.shadow.map.dispose(); soleil.shadow.map = null; }
      texel = 32 / tailleOmbre;
      mesureT = -1; mesureN = 0; mesureS = 0;
    } else qualiteFigee = true; // l'appareil suit : on arrête de mesurer
  }

  /* ---------- génération continue du décor ---------- */
  couches.forEach(c => c.suivant = -60);
  let dernierPhare = -1e9;

  function demiLargeur(z) {
    const dist = camera.position.z - z;
    return Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * dist * camera.aspect;
  }
  const EMPRISE = { maison: 1.6, chalet: 1.75, sapin: 0.8, neige: 0.8, rond: 1.0, bouleau: 0.6, pin: 1.05, buisson: 0.45, rocher: 0.4, lampadaire: 0.2, cactus: 0.4, dune: 1.8, phare: 0.75 };
  function jeter(o) { o.traverse(n => { if (n.material) { lumieres.delete(n.material); halos.delete(n.material); n.material.dispose(); } if (n.geometry && !PARTAGEES.has(n.geometry)) n.geometry.dispose(); }); }
  function retirer(o) {
    monde.remove(o); emetteurs.delete(o);
    o.traverse(n => { if (n.material) { lumieres.delete(n.material); halos.delete(n.material); n.material.dispose(); } if (n.geometry && !PARTAGEES.has(n.geometry)) n.geometry.dispose(); });
  }
  function peupler() {
    couches.forEach(c => {
      const zMoy = (c.z[0] + c.z[1]) / 2;
      const hw = demiLargeur(zMoy) + 8;
      if (c.suivant < x - hw) c.suivant = x - hw;
      const emprise = c.cle === "proche" || c.cle === "moyen";
      while (c.suivant < x + hw) {
        const C0 = colonne(distanceA(c.suivant));
        const biome = Math.random() < C0.m ? C0.b : C0.a;
        let type = c.cle === "nuage" ? "nuage" : pick(biome[c.cle]);
        if (type === "vide") { c.suivant += rnd(c.pas[0], c.pas[1]); continue; }
        if (type === "phare") { if (distanceA(c.suivant) - dernierPhare < 40) type = "pin"; else dernierPhare = distanceA(c.suivant); }
        const obj = F[type](biome, rnd(c.echelle[0], c.echelle[1]));
        // chaque objet occupe sa place le long du chemin : rien ne s'interpénètre dans une même rangée
        const s = obj.scale.x, r = (EMPRISE[type] || 0.4) * s;
        let X;
        if (!emprise) { X = c.suivant; c.suivant += rnd(c.pas[0], c.pas[1]); }
        else if (type === "cloture") { X = c.suivant; c.suivant = X + 2.45 * s + rnd(0.2, 1.4); }
        else { X = c.suivant + r; c.suivant = X + r + rnd(0.2, 1.6); }
        const D = distanceA(X), C = colonne(D), Z = rnd(c.z[0], c.z[1]);
        if (type !== "nuage" && eauAvec(C, Z) >= 0.02) { jeter(obj); continue; }
        obj.position.set(X, c.y ? rnd(c.y[0], c.y[1]) : hauteurAvec(C, D, Z), Z);
        obj.userData.marge = hw;
        if (type === "nuage") obj.userData.derive = rnd(0.05, 0.15);
        if (obj.userData.cheminee) { emetteurs.add(obj); obj.userData.prochaine = rnd(0, 1); }
        const proche = Z > -18 && type !== "nuage";
        obj.traverse(n => { if (n.isMesh) { n.castShadow = proche; n.receiveShadow = proche; } });
        monde.add(obj);
      }
    });
    for (let i = monde.children.length - 1; i >= 0; i--) {
      const o = monde.children[i];
      if (o.position.x < x - o.userData.marge - 8) retirer(o);
    }
  }

  /* ---------- cadrage ---------- */
  let decalage = 0.8, recul = 11;
  function redim() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    renderer.domElement.style.width = "100%"; renderer.domElement.style.height = "100%";
    camera.aspect = w / h;
    recul = 11 * Math.pow(Math.min(1, Math.max(0.5, camera.aspect)), 0.2);
    decalage = 0.8 * Math.min(1, camera.aspect);
    camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", redim);
  redim();

  /* ---------- boucle ---------- */
  const cHaut = new THREE.Color(), cHorizon = new THREE.Color(), cSol = new THREE.Color(), tmp = new THREE.Color();
  const NUIT_H = lin("#0d1424"), NUIT_HZ = lin("#25324a"), CREP = lin("#f0a878"), CREP_H = lin("#8f8aa8"), BLANC = new THREE.Color(1, 1, 1), GRIS_PLUIE = lin("#9aa3a8");
  const SOL_NUIT = lin("#1a2233"), LUNE_LUM = lin("#9fb4d8"), SOLEIL_LUM = lin("#fff0d8"), LUEUR_SOLEIL = lin("#ffe2b0"), LUEUR_LUNE = lin("#6a7a9a");
  const FUMEE_JOUR = lin("#e2e2de"), FUMEE_NUIT = lin("#3c4250"), EAU_JOUR = lin("#3d7480"), EAU_NUIT = lin("#142030");
  const d0 = rnd(0.05, 0.35);
  let tPrec = performance.now(), t = 0, dtLisse = 1 / 60;
  let fondPage = "";
  const dirSoleil = new THREE.Vector3(), mainMonde = new THREE.Vector3(), dirBaton = new THREE.Vector3(), qBaton = new THREE.Quaternion();
  let texel = 32 / tailleOmbre;

  function image(now) {
    const brut = Math.min(0.1, (now - tPrec) / 1000); tPrec = now;
    dtLisse += (brut - dtLisse) * 0.15;
    const dt = Math.min(0.05, dtLisse); t += dt;
    majQualite(brut);
    const pas = VITESSE * dt;
    x += pas; parcouru += pas;

    if (x > RECENTRAGE) {
      monde.children.forEach(o => o.position.x -= RECENTRAGE);
      oiseaux.forEach(o => o.position.x -= RECENTRAGE);
      faune.forEach(a => a.g.position.x -= RECENTRAGE);
      fumees.forEach(f => f.s.position.x -= RECENTRAGE);
      traces.forEach(tr => tr.m.position.x -= RECENTRAGE);
      couches.forEach(c => c.suivant -= RECENTRAGE);
      const decal = RECENTRAGE / TRONCON, anciens = [...troncons];
      troncons.clear();
      for (const [i, tr] of anciens) { tr.sol.position.x -= RECENTRAGE; tr.chemin.position.x -= RECENTRAGE; troncons.set(i - decal, tr); }
      file.length = 0;
      x -= RECENTRAGE;
    }
    planifierTerrain();
    avancerTerrain(3);

    /* foulée : deux pas par cycle, calés sur la distance parcourue */
    const ph = parcouru * Math.PI * 2 / FOULEE;
    jambeA.haut.rotation.z = Math.sin(ph) * 0.52;
    jambeB.haut.rotation.z = -Math.sin(ph) * 0.52;
    jambeA.bas.rotation.z = -Math.max(0, Math.cos(ph)) * 0.9;
    jambeB.bas.rotation.z = -Math.max(0, -Math.cos(ph)) * 0.9;
    brasA.haut.rotation.z = -Math.sin(ph) * 0.36;
    brasB.haut.rotation.z = Math.sin(ph) * 0.36;
    brasA.bas.rotation.z = 0.42 + Math.max(0, -Math.sin(ph)) * 0.22;
    brasB.bas.rotation.z = 0.35 + Math.max(0, Math.sin(ph)) * 0.3;
    baton.rotation.z = -(brasA.haut.rotation.z + brasA.bas.rotation.z) + 0.16;
    perso.position.x = x;
    perso.position.y = hauteurMarche(x) + (Math.abs(Math.cos(ph)) - 1) * 0.02;
    // la canne s'arrête exactement au sol (ou au tablier du pont), jamais au travers
    perso.updateMatrixWorld(true);
    baton.getWorldPosition(mainMonde); baton.getWorldQuaternion(qBaton);
    dirBaton.set(0, -1, 0).applyQuaternion(qBaton);
    let longueur = 0.45;
    if (dirBaton.y < -0.3) {
      for (let k = 0; k < 2; k++) {
        const bout = mainMonde.x + dirBaton.x * longueur;
        longueur = (mainMonde.y - hauteurMarche(bout) - 0.012) / -dirBaton.y;
      }
    }
    const lLocale = clamp(longueur, 0.12, 0.62) / ECHELLE_PERSO;
    tigeBaton.scale.y = lLocale; tigeBaton.position.y = -lLocale / 2; emboutBaton.position.y = -lLocale;
    corps.rotation.z = -0.04 + Math.sin(ph * 2) * 0.01;
    corps.scale.x = 1 + Math.sin(t * 1.6) * 0.012;
    const regard = lisse(0.75, 1, Math.sin(t * 0.23) * Math.sin(t * 0.071 + 1));
    tete.rotation.z = Math.sin(ph * 2) * 0.012 + regard * 0.16;
    tete.rotation.y = -regard * 0.3;
    sac.rotation.z = Math.sin(ph * 2) * 0.03;
    bonnet.children[2].position.x = Math.sin(ph * 2 + 0.5) * 0.008;

    for (const { pan, repos, ph: p0 } of pans) {
      const pp = pan.geometry.attributes.position;
      for (let i = 0; i < pp.count; i++) {
        const rx = repos[i * 3], ry = repos[i * 3 + 1];
        const h = -rx / 0.6;
        pp.setXYZ(i, rx * (1 - 0.06 * h * Math.sin(t * 3 + p0)), ry - h * h * 0.22 + Math.sin(t * 6.2 - h * 5 + p0) * 0.06 * h + Math.sin(t * 2.3 + p0) * 0.03 * h, Math.sin(t * 4.6 - h * 4 + p0) * 0.07 * h);
      }
      pp.needsUpdate = true; pan.geometry.computeVertexNormals();
    }

    camera.position.set(x + decalage, 1.75 + Math.sin(t * 0.31) * 0.03, recul);
    camera.lookAt(x + decalage, 1.85, 0);
    domeCiel.position.copy(camera.position);
    ciel.position.set(camera.position.x, 0, camera.position.z);

    /* vent sur la végétation */
    const rafale = 0.7 + 0.5 * Math.sin(t * 0.27) * Math.sin(t * 0.11 + 2);
    for (const o of monde.children) {
      const v = o.userData.vent;
      if (v) o.rotation.z = (Math.sin(t * v.freq + v.ph) * 0.6 + Math.sin(t * v.freq * 2.3 + v.ph) * 0.25 - 0.3) * v.amp * rafale;
      if (o.userData.derive) o.position.x += o.userData.derive * dt;
    }

    /* eau : niveau qui respire, rides qui dérivent */
    eau.position.x = camera.position.x;
    eau.position.y = -0.14 + Math.sin(t * 0.55) * 0.035 + Math.sin(t * 1.3) * 0.01;
    TEX.eau.offset.set(((distanceA(camera.position.x) / 7) + t * 0.01) % 1, (t * 0.004) % 1);

    /* jour et nuit */
    const d = (t / JOUR + d0) % 1;
    const FJ = 0.62;
    const pj = d < FJ ? d / FJ : (d - FJ) / (1 - FJ);
    const elev = d < FJ ? Math.sin(Math.PI * pj) : -Math.sin(Math.PI * pj);
    const nuit = lisse(0.1, -0.3, elev);
    const crep = Math.exp(-Math.pow(elev / 0.22, 2));
    const arc = Math.PI * pj;
    dirSoleil.set(-Math.cos(arc) * 0.9, 0.08 + Math.sin(arc) * 0.85, -0.5).normalize();
    const cible = Math.round(x / texel) * texel; // ombres stables, sans scintillement
    soleil.position.set(cible - Math.cos(arc) * 30, 4 + Math.sin(arc) * 36, 18);
    soleil.target.position.set(cible, 0, -3);
    soleil.intensity = d < FJ ? 1.7 * lisse(-0.05, 0.25, elev) : 0.45 * lisse(0, 0.3, -elev);
    soleil.color.copy(d < FJ ? SOLEIL_LUM : LUNE_LUM);
    if (d < FJ) soleil.color.lerp(CREP, crep * 0.6);

    /* couleurs du paysage traversé */
    const { a, b, m } = biomeEnCours(parcouru + 3);
    const mA = a.meteo, mB = b.meteo;
    const vague = clamp(0.35 + 0.75 * Math.sin(t * 0.07 + 1.3) * Math.sin(t * 0.023 + 0.4) + 0.3);
    const pluie = lerp(mA.pluie, mB.pluie, m) * vague;
    const neige = lerp(mA.neige, mB.neige, m) * clamp(vague + 0.3);
    const matin = d > 0.9 ? lisse(0.9, 0.98, d) : 1 - lisse(0.05, 0.16, d);
    const brume = lerp(mA.brume, mB.brume, m) * (0.6 + 0.4 * vague) + pluie * 0.3 + matin * 0.12;

    cHaut.copy(a.c.ciel).lerp(b.c.ciel, m);
    cHorizon.copy(a.c.horizon).lerp(b.c.horizon, m);
    cHaut.lerp(GRIS_PLUIE, pluie * 0.45); cHorizon.lerp(GRIS_PLUIE, pluie * 0.35);
    cHaut.lerp(CREP_H, crep * 0.35); cHorizon.lerp(CREP, crep * 0.55);
    cHaut.lerp(NUIT_H, nuit * 0.95); cHorizon.lerp(NUIT_HZ, nuit * 0.92);
    matCiel.uniforms.uHaut.value.copy(cHaut);
    matCiel.uniforms.uHorizon.value.copy(cHorizon);
    matCiel.uniforms.uDir.value.copy(dirSoleil);
    if (d < FJ) matCiel.uniforms.uLueur.value.copy(LUEUR_SOLEIL).multiplyScalar((1 - pluie * 0.8) * (0.6 + crep * 0.6));
    else matCiel.uniforms.uLueur.value.copy(LUEUR_LUNE).multiplyScalar(0.5 * (1 - pluie));
    scene.fog.color.copy(cHorizon);
    scene.fog.near = lerp(20, 7, brume); scene.fog.far = lerp(95, 40, brume);

    cSol.copy(a.c.sol).lerp(b.c.sol, m);
    hemi.color.copy(cHaut).lerp(BLANC, 0.45 * (1 - nuit));
    hemi.groundColor.copy(cSol).lerp(SOL_NUIT, nuit);
    hemi.intensity = lerp(0.95, 0.45, nuit);
    matEau.color.copy(EAU_JOUR).lerp(cHaut, 0.18).lerp(EAU_NUIT, nuit * 0.7);
    const fond = "#" + tmp.copy(cHorizon).convertLinearToSRGB().getHexString();
    if (fond !== fondPage) { document.body.style.background = fond; fondPage = fond; }

    matEt.opacity = nuit * 0.9 * (1 - pluie);
    lune.material.opacity = nuit * (1 - pluie * 0.7);
    if (d >= FJ) lune.position.set(-Math.cos(arc) * 150, 25 + Math.sin(arc) * 90, -180);
    const allume = s => lisse(s * 0.75, s * 0.75 + 0.14, nuit);
    for (const l of lumieres) l.emissiveIntensity = allume(l.userData.seuil) * 2.2;
    for (const h of halos) h.opacity = allume(h.userData.seuil) * 0.55 * (0.95 + 0.05 * Math.sin(t * 9));

    /* pluie */
    matPluie.opacity = pluie * 0.5 * (1 - nuit * 0.4);
    if (pluie > 0.01) {
      for (let i = 0; i < NP; i++) {
        const p = pluieBase[i];
        p.y -= 14 * dt; if (p.y < 0) p.y += 10;
        const cx = camera.position.x + p.x;
        pluiePos.set([cx, p.y, p.z, cx + 0.05, p.y + 0.4, p.z], i * 6);
      }
      geoPluie.attributes.position.needsUpdate = true;
    }
    function animer(N, op, maj) {
      N.m.opacity = op;
      if (op <= 0.01) return;
      for (let i = 0; i < N.n; i++) maj(N.base[i], i);
      const L = 2 * N.boite.x;
      for (let i = 0; i < N.n; i++) {
        const p = N.base[i];
        N.pos[i * 3] = camera.position.x + (((p.x + N.boite.x) % L) + L) % L - N.boite.x; N.pos[i * 3 + 1] = p.y; N.pos[i * 3 + 2] = p.z;
      }
      N.geo.attributes.position.needsUpdate = true;
    }
    animer(neigeP, neige * 0.95, p => { p.y -= 0.9 * p.v * dt; p.x += (Math.sin(t * 0.8 + p.ph) * 0.3 - 0.4) * dt - pas; if (p.y < 0) p.y += 9; });
    animer(feuillesP, poids("automne", a, b, m) * 0.9, p => { p.y -= 0.5 * p.v * dt; p.x += (Math.sin(t * 1.3 + p.ph) * 0.6 - 0.3) * dt - pas; if (p.y < 0) p.y += 9; });
    animer(pollen, (1 - nuit) * (1 - pluie) * 0.55 * (1 - poids("toundra", a, b, m)), p => { p.y += Math.sin(t * 0.5 + p.ph) * 0.05 * dt; p.x += (Math.cos(t * 0.3 + p.ph) * 0.08 - 0.05) * dt - pas; });
    const vert = clamp(1 - poids("toundra", a, b, m) - poids("désert", a, b, m));
    couleurLuciole.setRGB(0, 0, 0);
    for (const [nom, c] of Object.entries(TEINTES_LUCIOLES)) { const w = poids(nom, a, b, m); if (w) couleurLuciole.r += c[0] * w, couleurLuciole.g += c[1] * w, couleurLuciole.b += c[2] * w; }
    animer(lucioles, nuit * vert * (1 - pluie), (p, i) => {
      p.x += Math.sin(t * 0.6 * p.v + p.ph) * 0.25 * dt - pas; p.y = clamp(p.y + Math.cos(t * 0.8 * p.v + p.ph) * 0.15 * dt, 0.1, 1.8);
      let e;
      if (p.mode === 0) e = Math.pow(Math.max(0, Math.sin(t * 1.4 * p.v + p.ph * 3)), 6);                         // pulsation lente
      else if (p.mode === 1) { const q = (t * 0.45 * p.v + p.ph) % 1; e = Math.exp(-Math.pow((q - 0.1) / 0.03, 2)) + Math.exp(-Math.pow((q - 0.2) / 0.03, 2)); } // double éclat
      else e = Math.pow(Math.max(0, Math.sin(t * 0.9 - (p.x + 18) * 0.25)), 10);                                  // vague qui traverse l'essaim
      const c = lucioles.geo.attributes.color.array;
      c[i * 3] = e * couleurLuciole.r * p.nuance; c[i * 3 + 1] = e * couleurLuciole.g; c[i * 3 + 2] = e * couleurLuciole.b * (2 - p.nuance);
    });
    lucioles.geo.attributes.color.needsUpdate = true;

    /* fumée */
    for (const o of emetteurs) {
      o.userData.prochaine -= dt;
      if (o.userData.prochaine <= 0) {
        o.userData.prochaine = rnd(0.35, 0.7);
        const f = fumees[curseurFumee]; curseurFumee = (curseurFumee + 1) % fumees.length;
        f.s.position.copy(o.userData.cheminee).multiplyScalar(o.scale.x).add(o.position);
        f.s.visible = true; f.vie = 0; f.duree = rnd(3.5, 5.5); f.ph = rnd(0, 6);
      }
    }
    for (const f of fumees) {
      if (!f.s.visible) continue;
      f.vie += dt;
      const q = f.vie / f.duree;
      if (q >= 1) { f.s.visible = false; continue; }
      f.s.position.y += 0.35 * dt; f.s.position.x += (-0.25 + Math.sin(t + f.ph) * 0.05) * dt;
      const tl = 0.25 + q * 1.1; f.s.scale.set(tl, tl, 1);
      f.s.material.opacity = Math.sin(Math.PI * q) * 0.35 * (1 - pluie * 0.5);
      f.s.material.color.copy(FUMEE_JOUR).lerp(FUMEE_NUIT, nuit);
    }

    /* oiseaux */
    if (nuit < 0.3 && pluie < 0.4 && oiseaux.length === 0 && Math.random() < dt / 12) {
      const n = 3 + Math.floor(Math.random() * 5), dir = Math.random() < 0.5 ? 1 : -1;
      const hw = demiLargeur(-12) + 4, y0 = rnd(4.5, 7), z0 = rnd(-8, -16);
      for (let k = 0; k < n; k++) nouvelOiseau(camera.position.x - dir * (hw + k * rnd(0.6, 1.2)), y0 + rnd(-0.5, 0.5), z0 + rnd(-1, 1), dir * rnd(2.2, 2.8));
    }
    for (let i = oiseaux.length - 1; i >= 0; i--) {
      const o = oiseaux[i], u = o.userData;
      o.position.x += u.vx * dt;
      o.position.y += Math.sin(t * 0.7 + u.ph) * 0.2 * dt;
      o.rotation.y = u.vx > 0 ? 0 : Math.PI;
      const ang = Math.sin(t * 0.5 + u.ph) > (u.plane ? -0.3 : 0.3) ? 0.15 + Math.sin(t * 1.5 + u.ph) * 0.05 : Math.sin(t * (u.plane ? 8 : 13) + u.ph) * 0.7;
      u.pG.rotation.x = ang; u.pD.rotation.x = -ang;
      if (Math.abs(o.position.x - camera.position.x) > demiLargeur(o.position.z) + 14) { scene.remove(o); oiseaux.splice(i, 1); }
    }

    // ombres des nuages : elles glissent avec le vent, s'effacent la nuit et sous un ciel couvert
    ombresNuages.uOmbreDecal.value.set((t * 0.012) % 1, (t * 0.004) % 1);
    ombresNuages.uOmbreX.value = parcouru - x;
    ombresNuages.uOmbreForce.value = 0.3 * (1 - nuit) * (1 - pluie) * lisse(0.05, 0.3, elev);
    majTraces(ph, dt);
    majArc(pluie, elev, dt);
    majBrume(matin * (1 - nuit * 0.5), cHorizon, t);
    majFilantes(nuit, pluie, dt);
    majPassages();
    animerFaune(dt, t, nuit);
    peupler();
    renderer.render(scene, camera);
    requestAnimationFrame(image);
  }

  // préparation : terrain et décor complets avant la première image
  camera.position.set(decalage, 1.75, recul);
  planifierTerrain();
  while (file.length) { if (file[0].gen.next().done) file.shift(); }
  peupler();
  requestAnimationFrame(image);

  async function garderEcranAllume() {
    try { if ("wakeLock" in navigator && !document.hidden) await navigator.wakeLock.request("screen"); } catch (e) {}
  }
  garderEcranAllume();
  document.addEventListener("visibilitychange", garderEcranAllume);
})();
</script>
